<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Netflix</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #141414;
            color: #fff;
        }
        .container {
            width: 90%;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
        }
        #video-player-container {
            margin-bottom: 20px;
        }
        #video-player {
            width: 100%;
        }
        #video-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        .thumbnail {
            cursor: pointer;
            width: 200px;
            border: 2px solid transparent;
            transition: border-color 0.3s;
        }
        .thumbnail:hover, .thumbnail.active {
            border-color: #E50914;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Free Netflix</h1>
        <div id="video-player-container">
            <video id="video-player" controls autoplay muted>
                <!-- The video source will be set by JavaScript -->
            </video>
        </div>
        <h2>Gallery</h2>
        <div id="video-gallery">
            <!-- Thumbnails will be loaded here by JavaScript -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const videoPlayer = document.getElementById('video-player');
            const videoGallery = document.getElementById('video-gallery');
            let currentThumbnail = null;

            // Fetch video data from the backend API
            fetch('/api/videos')
                .then(response => response.json())
                .then(videos => {
                    if (videos.length === 0) {
                        videoGallery.innerHTML = '<p>No videos available.</p>';
                        return;
                    }

                    // Populate the gallery
                    videos.forEach(video => {
                        const thumb = document.createElement('img');
                        thumb.src = video.thumb;
                        thumb.alt = video.title;
                        thumb.title = video.title;
                        thumb.classList.add('thumbnail');
                        thumb.dataset.videoSrc = video.source;

                        thumb.addEventListener('click', () => {
                            playVideo(video.source, thumb);
                        });

                        videoGallery.appendChild(thumb);
                    });

                    // Load the first video by default
                    const firstThumbnail = videoGallery.querySelector('.thumbnail');
                    if (firstThumbnail) {
                        playVideo(videos[0].source, firstThumbnail);
                    }
                })
                .catch(error => {
                    console.error('Error fetching videos:', error);
                    videoGallery.innerHTML = '<p>Could not load videos.</p>';
                });

            function playVideo(src, thumbnailElement) {
                // Update video player
                videoPlayer.src = src;
                videoPlayer.load();
                videoPlayer.play();

                // Update active thumbnail styling
                if (currentThumbnail) {
                    currentThumbnail.classList.remove('active');
                }
                thumbnailElement.classList.add('active');
                currentThumbnail = thumbnailElement;
            }
        });
    </script>
</body>
</html>
